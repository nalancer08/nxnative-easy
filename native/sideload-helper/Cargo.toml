[package]
name = "nxnative-sideload"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Apple-silicon signing/install helper for nxnative Easy"

[dependencies]
isideload = "=0.5.0"
idevice = { version = "=0.1.68", default-features = false, features = ["usbmuxd", "installation_proxy", "ring", "afc", "house_arrest"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
keyring = { version = "3.6", features = ["apple-native"] }
rootcause = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "8.3", default-features = false, features = ["deflate"] }
tempfile = "3"
url = "2"
zeroize = "1"

uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
isideload = { path = "vendor/isideload" }
