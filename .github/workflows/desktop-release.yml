name: Build portable desktop release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: brew install xcodegen zstd glslang
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.403'
      - name: Release Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install lz4 capstone fonttools backports.zstd
          echo "$RUNNER_TEMP/release-python/bin" >> "$GITHUB_PATH"
      - name: Build and validate
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/build_desktop_app.py --portable --output "$RUNNER_TEMP/nxnative Easy.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/nxnative Easy.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/nxnative Easy.app" nxnative-Easy-macOS-arm64.zip
          shasum -a 256 nxnative-Easy-macOS-arm64.zip > SHA256SUMS
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("desktop/release.json"))["version"])')
          gh release create "v$version" nxnative-Easy-macOS-arm64.zip SHA256SUMS --target "$GITHUB_SHA" --title "nxnative Easy $version" --notes "Portable ARM64 launcher, source and build tools included. Xcode is still required. Bring your own games and keys. No developer signing identity is included."
